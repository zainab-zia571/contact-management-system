# ── Application ──────────────────────────────────────────
spring.application.name=contact-manager

# ── SQL Server ───────────────────────────────────────────
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=contact_management;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=zainabzia123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ── JPA / Hibernate ──────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ──────────────────────────────────────────────────
app.jwt.secret=your_very_long_secret_key_minimum_32_characters_long
app.jwt.expiration-ms=86400000

# ── Logging ──────────────────────────────────────────────
logging.config=classpath:logback-spring.xml

# ── Server ───────────────────────────────────────────────
server.port=8080